<!doctype html>
<html lang="ar" dir="rtl" class="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Three faces, each with a job. Plus Jakarta Sans carries the headings:
         geometric and confident, and distinct enough that the site stops
         reading as a default system-font page. Inter takes the body and the UI,
         where its wide apertures and tall x-height matter more than character.
         Noto Kufi Arabic renders بيتك properly instead of leaving it to a
         fallback that does not match anything around it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Arabic, the default language. i18n/index.js swaps it for the reader's
         language once the app starts. -->
    <title>بيتك | عقارات للإيجار في الأردن</title>

    <!-- Link previews. The page itself is built by script, which link
         crawlers (LinkedIn, WhatsApp, Slack) do not run, so without these a
         shared link shows a bare title or no card at all. -->
    <meta name="description" content="Homes for weekly, monthly or yearly rent across Jordan, in Arabic and English." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beytak · بيتك" />
    <meta property="og:title" content="Beytak · بيتك | Homes for rent in Jordan" />
    <meta property="og:description" content="Homes for weekly, monthly or yearly rent across Jordan, in Arabic and English." />
    <meta property="og:url" content="https://beytak.pages.dev/" />
    <meta property="og:image" content="https://beytak.pages.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Beytak home page: search homes for rent across Jordan" />
    <meta property="og:locale" content="ar_JO" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Beytak · بيتك | Homes for rent in Jordan" />
    <meta name="twitter:description" content="Homes for weekly, monthly or yearly rent across Jordan, in Arabic and English." />
    <meta name="twitter:image" content="https://beytak.pages.dev/og-image.jpg" />

    <!-- Search engines -->
    <link rel="canonical" href="https://beytak.pages.dev/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#D42A2A" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Beytak",
        "alternateName": "بيتك",
        "url": "https://beytak.pages.dev/",
        "description": "Homes for weekly, monthly or yearly rent across Jordan, in Arabic and English.",
        "inLanguage": ["ar", "en"],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://beytak.pages.dev/houses?city={city}",
          "query-input": "required name=city"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
